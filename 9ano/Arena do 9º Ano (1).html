<title>Arena do 9º Ano</title>

<style>
/* Layout: "aventura" em uma coluna; arena de batalha ilustrada em cima, perguntas embaixo */
:root{
  /* Arena neon: fundo de fliperama escuro, um ciano elétrico como destaque, cores vivas por matéria */
  --bg:#0a0b1e; --paper:#14163a; --ink:#eef1ff; --muted:#9aa3d6; --line:#2c3170;
  --por:#ff3dbb; --mat:#00d1ff; --cie:#7cff4f; --his:#ffb020; --geo:#ff7a1a; --fil:#ff4f7d; --ing:#21e6c1; --art:#b26bff; --lit:#9d8cff; --red:#ffe14d; --dir:#4da3ff; --boss:#7b5cff;
  --ok:#41f59a; --okbg:#0f3a2b; --bad:#ff5c7a; --badbg:#3d1428; --star:#ffd23f; --xp:#00e5ff;
  --arena:radial-gradient(70% 45% at 50% 100%,rgba(0,229,255,.35),transparent 70%),linear-gradient(#170a3a,#3a1170 60%,#121a4a 60%,#060a24);
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Exo 2","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background-image:linear-gradient(rgba(0,229,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.06) 1px,transparent 1px);background-size:32px 32px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(30px,7vw,48px);font-weight:800}
h1 span{color:var(--xp)}
h2.sec{font-size:24px}
.sub{color:var(--muted);margin:4px 0 0;font-weight:700}
.card{background:var(--paper);border-radius:26px;padding:20px;border:3px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.tip{color:var(--muted);font-size:15px;font-weight:700;text-align:center;margin:0}
.link{all:unset;cursor:pointer;color:var(--muted);font-weight:800;font-size:15px;text-decoration:underline}
.link:focus-visible{outline:3px solid var(--ink);border-radius:4px}
.go{all:unset;cursor:pointer;background:var(--c,var(--xp));color:#fff;font-family:var(--display);font-weight:800;font-size:22px;
  border-radius:18px;padding:12px 26px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.go:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.go[disabled]{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--paper);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.go.danger{background:var(--bad)}
svg{display:block}
/* criador */
.maker{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.preview{position:sticky;top:12px;background:var(--arena);border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line)}
.preview .big{width:100%;aspect-ratio:1}
.preview .big svg,.preview .eg svg{width:100%;height:100%}
.preview .cap{font-weight:800;font-size:14px;color:#1b2a4a;text-align:center}
.preview .eg{width:64px;height:64px}
.preview .nm{font-family:var(--display);font-weight:800;font-size:26px;color:#1b2a4a}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.ch{all:unset;cursor:pointer;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:15px;min-width:76px}
.ch svg{width:64px;height:64px}
.ch.sel{border-color:var(--xp);background:var(--paper);box-shadow:0 4px 0 var(--xp)}
.ch:focus-visible,.sw:focus-visible,.wear:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.pw svg{width:40px;height:40px}
.sw{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 3px var(--line)}
.sw.sel{box-shadow:0 0 0 4px var(--xp)}
input[type=text]{font:inherit;font-weight:800;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[type=text]:focus{outline:none;border-color:var(--xp)}
.step{font-family:var(--display);font-weight:800;font-size:21px}
/* casa */
.hero{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:18px;align-items:center}
.habitat{background:var(--arena);border-radius:24px;aspect-ratio:1;position:relative;overflow:hidden}
.habitat svg{width:100%;height:100%}
.habitat::before{content:"";position:absolute;left:12%;top:10%;width:34%;height:12%;background:#fff;border-radius:40px;opacity:.85;box-shadow:70px 18px 0 -6px #fff}
.hero-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.lvl{font-weight:800;color:var(--xp);text-transform:uppercase;letter-spacing:1px;font-size:14px}
.mname{font-size:clamp(30px,6vw,42px)}
.xpbar{height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);border-radius:999px;transition:width .6s}
.xptxt{font-weight:800;font-size:15px;color:var(--muted)}
.album{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.form{background:var(--bg);border-radius:18px;padding:6px;text-align:center;font-weight:800;font-size:13px;border:3px solid var(--line)}
.form svg{width:100%;aspect-ratio:1;height:auto}
.form.lock svg{filter:brightness(0);opacity:.22}
.form.now{border-color:var(--xp)}
.form span{display:block;color:var(--muted)}
.wardrobe{display:flex;gap:10px;flex-wrap:wrap}
.wear{all:unset;cursor:pointer;border:3px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 14px;font-weight:800;font-size:16px}
.wear.sel{border-color:var(--xp);background:var(--paper);box-shadow:0 4px 0 var(--xp)}
.wear[disabled]{cursor:not-allowed;opacity:.5}
.dex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dex .form{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.subj{all:unset;cursor:pointer;background:var(--paper);border:3px solid var(--c);border-radius:22px;padding:12px;
  display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--c);transition:transform .12s}
.subj:hover{transform:translateY(-3px)}
.subj:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.subj:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.subj .foe{width:72px;height:72px;flex:none;border-radius:16px;background:var(--c);display:grid;place-items:center}
.subj .foe svg{width:66px;height:66px}
.subj h3{font-size:22px}
.subj small{color:var(--muted);font-weight:700;font-size:14px;display:block}
.date{color:var(--c)!important}
.best{color:var(--star)!important;font-weight:800;letter-spacing:2px}
/* arena */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--c);color:#fff;font-weight:800;border-radius:999px;padding:4px 14px;font-size:15px;letter-spacing:.5px;text-transform:uppercase}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:800;font-size:16px;padding:6px 4px}
.back:focus-visible{outline:3px solid var(--ink);border-radius:6px}
.arena{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/10;max-height:440px;width:100%;border:3px solid var(--line)}
.arena .pad{position:absolute;border-radius:50%;background:rgba(0,0,0,.16)}
.arena .who{position:absolute}
.arena .who svg{width:100%;height:100%}
#pl{left:2%;bottom:2%;width:42%;aspect-ratio:1}
#en{right:4%;top:8%;width:33%;aspect-ratio:1}
.pad.p1{left:4%;bottom:3%;width:38%;height:12%}
.pad.p2{right:5%;top:34%;width:30%;height:9%}
.hpbox{position:absolute;background:#fff;color:#1b2a4a;border-radius:14px;padding:6px 10px;border:3px solid #1b2a4a;font-weight:800;font-size:clamp(12px,2.6vw,16px);min-width:0;max-width:46%}
.hpbox b{font-family:var(--display);font-size:1.15em}
.hpbox .hp{height:10px;background:#d9dde8;border-radius:999px;overflow:hidden;margin-top:3px;width:clamp(90px,24vw,170px)}
.hpbox .hp i{display:block;height:100%;border-radius:999px;transition:width .5s,background .5s}
#hb1{left:3%;top:5%}
#hb2{right:3%;bottom:6%}
.faint svg{filter:grayscale(1) brightness(.85);transform:rotate(-80deg) translateY(30%);transition:transform .6s,filter .6s}
.proj{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.proj svg{width:100%;height:100%}
.scene-name{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(255,255,255,.85);color:#1b2a4a;border-radius:999px;padding:2px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .3s}
.q{font-family:var(--display);font-size:clamp(22px,5vw,30px);font-weight:800;margin:2px 0}
.count{color:var(--muted);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{all:unset;cursor:pointer;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:12px 14px;
  font-weight:800;font-size:19px;display:flex;gap:12px;align-items:center}
.opt b{width:34px;height:34px;flex:none;border-radius:10px;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display)}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt:focus-visible{outline:4px solid var(--c);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{border-radius:18px;padding:12px 16px;font-weight:700}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.no{background:var(--badbg);border:2px solid var(--bad)}
.fb strong{font-family:var(--display);font-size:22px;display:block}
.fb .gain{color:var(--xp)}
.stars{font-size:54px;letter-spacing:6px;color:var(--star);text-align:center;line-height:1}
.stars .off{color:var(--line)}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.end .duo{display:flex;gap:10px;justify-content:center;align-items:end}
.end .duo div{width:150px;max-width:42vw;aspect-ratio:1}
.end .duo svg{width:100%;height:100%}
.score{font-family:var(--display);font-size:56px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.xpgain{font-family:var(--display);font-size:26px;font-weight:800;color:var(--xp)}
/* avisos */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--paper);border:3px solid var(--xp);border-radius:22px;
  padding:8px 16px 8px 8px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:tin .4s}
.toast .t-img{width:70px;height:70px;flex:none;background:var(--arena);border-radius:16px}
.toast .t-img svg{width:100%;height:100%}
.toast b{font-family:var(--display);font-size:22px;color:var(--xp);display:block;line-height:1}
.toast span{font-weight:800}
@keyframes tin{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
.evo{position:fixed;inset:0;z-index:20;background:rgba(10,14,40,.85);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.evo .box{background:var(--paper);border-radius:28px;padding:22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.evo .st{width:230px;max-width:100%;aspect-ratio:1;margin:0 auto;position:relative;background:var(--arena);border-radius:22px}
.evo .st>div{position:absolute;inset:0}
.evo .st svg{width:100%;height:100%}
.evo .old{animation:fadeOld 2.4s forwards}
.evo .new{opacity:0;animation:fadeNew 2.4s forwards}
.evo .flash{background:#fff;border-radius:22px;opacity:0;animation:flash 2.4s forwards}
@keyframes fadeOld{0%{opacity:1}10%,20%,30%{filter:brightness(4)}15%,25%{filter:brightness(1)}45%,100%{opacity:0}}
@keyframes fadeNew{0%,55%{opacity:0;transform:scale(.5)}75%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes flash{0%,35%{opacity:0}48%{opacity:1}70%,100%{opacity:0}}
.evo h2{font-size:30px;color:var(--xp)}
/* animações do bichinho */
.bob svg{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
.wig svg{animation:wig 1.5s infinite;transform-origin:50% 90%}
@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}85%{transform:rotate(7deg)}92%{transform:rotate(-3deg)}}
.aura{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
.twk{animation:twk 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes twk{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (max-width:600px){.maker,.hero{grid-template-columns:1fr}.preview{position:static;max-width:280px;margin:0 auto;width:100%}
 .habitat{max-width:260px;width:100%;margin:0 auto}.hero-info{text-align:center;align-items:center}.dex{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.evo .new{opacity:1}.evo .old,.evo .flash{display:none}}
.snd{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.snd button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid var(--xp);display:grid;place-items:center;box-shadow:0 4px 0 var(--xp);color:var(--xp)}
.snd button[aria-pressed="false"]{border-color:var(--line);box-shadow:0 4px 0 var(--line);color:var(--muted)}
.snd button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.snd svg{width:26px;height:26px}
.snd .x{display:none}.snd button[aria-pressed="false"] .x{display:block}
@media (max-width:600px){header{padding-right:112px}}

/* ===== animações extras ===== */
.blink{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

.amb span{position:absolute;font-family:var(--display);font-weight:800;line-height:1}

.amb .bub{border:2px solid rgba(255,255,255,.95);border-radius:50%;background:rgba(255,255,255,.25)}

@keyframes fall{from{top:-12%;transform:rotate(0)}to{top:108%;transform:rotate(300deg)}}
@keyframes rise{from{top:105%;opacity:0}15%{opacity:.95}80%{opacity:.95}to{top:-15%;opacity:0}}

const S = {
 red:{nome:"Redação",ic:"Aa",data:"03/11",desc:"Projeto de Lei: estrutura e linguagem",q:[
  ["Num projeto de lei, a parte que resume em poucas linhas o assunto da lei chama-se:",["Ementa","Epígrafe","Justificativa","Cláusula de vigência"],0,"A EMENTA resume o objeto da lei, logo abaixo da epígrafe."],
  ["A EPÍGRAFE de um projeto de lei é a parte que traz:",["O tipo de norma, o número e o ano","Os motivos da proposta","O nome dos eleitores","As punições previstas"],0,"A EPÍGRAFE identifica a norma: tipo, NÚMERO e ANO (ex.: Projeto de Lei nº 12/2026)."],
  ["O corpo do projeto de lei, onde ficam as regras propostas, é organizado em:",["Artigos","Estrofes","Capítulos de romance","Parágrafos narrativos"],0,"O texto normativo é dividido em ARTIGOS (Art. 1º, Art. 2º...)."],
  ["Qual forma de numerar artigos está correta?",["Art. 9º e Art. 10.","Art. 9 e Art. 10º","Art. nono e Art. décimo","Art. IX e Art. X"],0,"Até o nono usamos ORDINAL (9º); a partir do 10, CARDINAL (Art. 10.)."],
  ["Os incisos de um artigo são indicados por:",["Algarismos romanos (I, II, III)","Letras minúsculas (a, b, c)","O símbolo §","Asteriscos"],0,"INCISOS usam algarismos ROMANOS; alíneas usam letras minúsculas."],
  ["O símbolo § indica um:",["Parágrafo","Inciso","Capítulo","Anexo"],0,"§ é o símbolo de PARÁGRAFO. Se houver só um, escreve-se Parágrafo único."],
  ["As subdivisões de um inciso, marcadas por letras minúsculas, são as:",["Alíneas","Ementas","Epígrafes","Cláusulas"],0,"As ALÍNEAS (a, b, c) detalham os incisos."],
  ["A JUSTIFICATIVA de um projeto de lei serve para:",["Explicar os motivos e a importância da proposta","Repetir o título","Listar os votos dos vereadores","Narrar uma história de ficção"],0,"A JUSTIFICATIVA argumenta: por que a lei é NECESSÁRIA."],
  ["Esta lei entra em vigor na data de sua publicação. Essa frase é a:",["Cláusula de vigência","Ementa","Epígrafe","Alínea"],0,"A CLÁUSULA DE VIGÊNCIA diz QUANDO a lei passa a valer."],
  ["Qual frase tem a linguagem adequada a um projeto de lei?",["Fica proibido o uso de copos descartáveis nas escolas municipais.","Galera, bora parar com copo descartável!","Eu acho que talvez fosse legal evitar copos.","Copos descartáveis? Nunca mais, né?"],0,"A linguagem é FORMAL, IMPESSOAL e OBJETIVA, sem gírias nem opiniões pessoais."],
  ["No município, quem discute e vota os projetos de lei é:",["A Câmara de Vereadores","O Tribunal de Justiça","A diretoria da escola","O Senado Federal"],0,"Leis municipais são votadas pela CÂMARA DE VEREADORES."],
  ["Depois de aprovado, o projeto vai ao chefe do Executivo, que pode:",["Sancionar ou vetar","Apenas arquivar","Mudar todos os artigos sozinho","Transformar em emenda constitucional"],0,"O prefeito, governador ou presidente pode SANCIONAR (aprovar) ou VETAR."],
  ["Quando cidadãos reúnem assinaturas para apresentar um projeto de lei, temos a:",["Iniciativa popular","Sanção presidencial","Medida provisória","Cláusula pétrea"],0,"A INICIATIVA POPULAR permite que a população proponha leis."],
  ["Em projetos de lei, os verbos costumam aparecer:",["No presente ou no futuro do presente, com valor de norma","No pretérito, narrando fatos","No imperativo informal","Sempre na 1ª pessoa"],0,"Ex.: Fica instituído..., A escola deverá... Verbos com VALOR DE NORMA."],
  ["Qual problema é um bom ponto de partida para um projeto de lei escolar?",["Falta de bicicletários seguros perto das escolas","O final de uma novela","A cor preferida da turma","O resultado de um jogo de videogame"],0,"O projeto de lei nasce de um PROBLEMA COLETIVO real que uma regra pode resolver."]
 ]},
 mat:{nome:"Matemática",ic:"%",data:"03/11",desc:"Estatística, gráficos, pesquisa e porcentagem",q:[
  ["Qual gráfico é o mais indicado para mostrar a evolução da temperatura ao longo dos meses?",["Gráfico de linhas","Gráfico de setores","Pictograma sem escala","Tabela de dupla entrada"],0,"O gráfico de LINHAS mostra variação ao longo do TEMPO."],
  ["Para mostrar como 100% dos votos se dividiram entre candidatos, o melhor gráfico é o de:",["Setores (pizza)","Linhas","Dispersão","Histograma de tempo"],0,"O gráfico de SETORES mostra as partes de um TODO."],
  ["Numa pesquisa, a AMOSTRA é:",["A parte da população que foi efetivamente pesquisada","Todos os moradores do país","O gráfico final","A pergunta da pesquisa"],0,"A AMOSTRA é um grupo que representa a POPULAÇÃO."],
  ["Uma escola tem 1.200 alunos e 150 responderam a uma pesquisa. A amostra é de:",["150 alunos","1.200 alunos","1.050 alunos","12,5 alunos"],0,"Foram pesquisados 150: essa é a AMOSTRA. A população é de 1.200."],
  ["Qual destas é uma variável QUALITATIVA?",["Time de futebol preferido","Altura em centímetros","Número de irmãos","Idade em anos"],0,"Variável QUALITATIVA expressa uma qualidade ou categoria, não um número."],
  ["Qual é a média aritmética de 6, 8, 7 e 9?",["7,5","7","8","30"],0,"(6 + 8 + 7 + 9) ÷ 4 = 30 ÷ 4 = 7,5."],
  ["Qual é a MODA de 3, 5, 5, 7, 8, 5, 2?",["5","3","7","5,5"],0,"A MODA é o valor que mais se repete: o 5 aparece 3 vezes."],
  ["Qual é a MEDIANA de 2, 9, 4, 7, 5?",["5","4","7","5,4"],0,"Ordenando: 2, 4, 5, 7, 9. O termo central é 5."],
  ["Qual é a mediana de 3, 8, 6, 10?",["7","6","8","6,75"],0,"Ordenando: 3, 6, 8, 10. Com quantidade par, faz-se a média dos centrais: (6 + 8) ÷ 2 = 7."],
  ["Qual é a AMPLITUDE de 12, 18, 7, 25, 15?",["18","25","7","15,4"],0,"AMPLITUDE = maior − menor = 25 − 7 = 18."],
  ["O conjunto 1, 2, 3, 4 tem moda?",["Não, é amodal","Sim, a moda é 4","Sim, a moda é 2,5","Sim, são todos"],0,"Se nenhum valor se repete, o conjunto é AMODAL."],
  ["Quanto é 25% de 80?",["20","25","40","8"],0,"25% = 1/4. 80 ÷ 4 = 20."],
  ["Um tênis custa R$ 150,00 e tem 20% de desconto. Qual o preço final?",["R$ 120,00","R$ 130,00","R$ 30,00","R$ 170,00"],0,"20% de 150 = 30. 150 − 30 = 120."],
  ["Numa turma de 60 alunos, 18 usam óculos. Isso representa:",["30%","18%","20%","33%"],0,"18 ÷ 60 = 0,30 = 30%."],
  ["Um salário de R$ 2.000,00 teve aumento de 15%. O novo salário é:",["R$ 2.300,00","R$ 2.150,00","R$ 2.015,00","R$ 3.500,00"],0,"15% de 2.000 = 300. 2.000 + 300 = 2.300."],
  ["Um produto de R$ 100,00 sobe 10% e depois tem desconto de 10%. Ele passa a custar:",["R$ 99,00","R$ 100,00","R$ 101,00","R$ 90,00"],0,"100 → 110 → 110 − 11 = 99. Os 10% são calculados sobre VALORES DIFERENTES."],

  ["Numa pesquisa com 250 pessoas, 40% preferem praia. Quantas pessoas são?",["100","40","150","125"],0,"40% de 250 = 0,4 × 250 = 100."],
  ["Antes de aplicar uma pesquisa, o primeiro passo do planejamento é:",["Definir o tema e o objetivo da pesquisa","Desenhar o gráfico","Calcular a média","Publicar os resultados"],0,"Planejar começa por definir o OBJETIVO: o que se quer descobrir."]
 ]},
 ing:{nome:"Inglês",ic:"EN",data:"04/11",desc:"Tag questions e phrasal verbs",q:[
  ["Complete: You are a student, ___?",["aren't you","are you","don't you","isn't it"],0,"Frase afirmativa pede tag NEGATIVA com o mesmo auxiliar: AREN'T YOU."],
  ["Complete: She isn't tired, ___?",["is she","isn't she","does she","was she"],0,"Frase negativa pede tag AFIRMATIVA: IS SHE."],
  ["Complete: They play soccer on Sundays, ___?",["don't they","aren't they","do they","didn't they"],0,"No simple present sem auxiliar visível, usamos DO: DON'T THEY."],
  ["Complete: He went to the party, ___?",["didn't he","doesn't he","wasn't he","went he"],0,"Went está no passado, então a tag usa DID: DIDN'T HE."],
  ["Complete: You can swim, ___?",["can't you","can you","don't you","won't you"],0,"Repetimos o modal: CAN'T YOU."],
  ["Complete: I am late, ___?",["aren't I","amn't I","am I","isn't I"],0,"Caso especial: I am pede a tag AREN'T I."],
  ["Complete: Let's go to the cinema, ___?",["shall we","will you","don't we","let we"],0,"Com Let's, a tag é SHALL WE."],
  ["Complete: She has finished the project, ___?",["hasn't she","doesn't she","didn't she","has she"],0,"O auxiliar é HAS: HASN'T SHE."],
  ["Complete: It won't rain tomorrow, ___?",["will it","won't it","does it","is it"],0,"Frase negativa com won't (will not): tag afirmativa WILL IT."],
  ["Para que servem as tag questions?",["Confirmar uma informação ou pedir concordância","Dar ordens","Contar histórias no passado","Fazer comparações"],0,"A tag question CONFIRMA algo: You're coming, aren't you?"],
  ["O phrasal verb GIVE UP significa:",["Desistir","Doar","Levantar","Devolver"],0,"GIVE UP = DESISTIR. Don't give up! = Não desista!"],
  ["O phrasal verb LOOK FOR significa:",["Procurar","Cuidar de","Olhar para cima","Admirar"],0,"LOOK FOR = PROCURAR. I'm looking for my keys."],
  ["Turn off the lights quer dizer:",["Desligue as luzes","Ligue as luzes","Troque as luzes","Olhe as luzes"],0,"TURN OFF = DESLIGAR; turn on = ligar."],
  ["O phrasal verb FIND OUT significa:",["Descobrir","Sair","Perder","Esconder"],0,"FIND OUT = DESCOBRIR uma informação."],
  ["I get along with my brother quer dizer:",["Eu me dou bem com meu irmão","Eu brigo com meu irmão","Eu saio com meu irmão","Eu pareço com meu irmão"],0,"GET ALONG WITH = DAR-SE BEM com alguém."],
  ["Put on your jacket! quer dizer:",["Vista sua jaqueta!","Tire sua jaqueta!","Guarde sua jaqueta!","Compre uma jaqueta!"],0,"PUT ON = VESTIR; take off = tirar."],
  ["Who will LOOK AFTER the dog? Look after significa:",["Cuidar de","Procurar","Seguir","Desistir de"],0,"LOOK AFTER = CUIDAR DE."],
  ["Qual frase usa WAKE UP corretamente?",["I wake up at 6 a.m. every day.","I wake up my homework.","She wakes up the bus.","They wake up a pizza."],0,"WAKE UP = ACORDAR."]
 ]},
 his:{nome:"História",ic:"clock",data:"04/11",desc:"Fim da URSS, globalização e Nova República",q:[

  ["No pôster científico, a seção que explica COMO a pesquisa foi feita é a:",["Metodologia","Conclusão","Referências","Introdução"],0,"A METODOLOGIA descreve os métodos e procedimentos."],
  ["A seção que lista livros, sites e artigos consultados é a de:",["Referências","Resultados","Objetivos","Título"],0,"As REFERÊNCIAS mostram as FONTES da pesquisa."],
  ["Por que o pôster científico combina textos curtos, gráficos e imagens?",["Para ser compreendido rapidamente durante a apresentação","Para esconder os dados","Para substituir a pesquisa","Porque não precisa de autor"],0,"O pôster precisa ser LIDO RÁPIDO, de pé, durante uma exposição."],
  ["As orações subordinadas ADJETIVAS exercem a função de:",["Adjetivo, caracterizando um termo da oração principal","Advérbio de tempo","Sujeito do verbo","Conjunção coordenativa"],0,"Elas funcionam como um ADJETIVO e são introduzidas por PRONOME RELATIVO."],
  ["Em O livro que eu li é ótimo, a oração que eu li é:",["Subordinada adjetiva restritiva","Subordinada adverbial causal","Coordenada aditiva","Subordinada substantiva objetiva direta"],0,"Ela RESTRINGE: não é qualquer livro, é o que eu li. Sem vírgulas: RESTRITIVA."],
  ["Em Machado de Assis, que nasceu no Rio de Janeiro, escreveu O Alienista, a oração entre vírgulas é:",["Adjetiva explicativa","Adjetiva restritiva","Adverbial temporal","Substantiva subjetiva"],0,"Ela acrescenta uma informação sobre alguém já definido: EXPLICATIVA, entre VÍRGULAS."],
  ["Em Os alunos que estudaram foram aprovados, entende-se que:",["Só parte dos alunos, os que estudaram, foi aprovada","Todos os alunos foram aprovados","Nenhum aluno foi aprovado","Os alunos estudaram depois da prova"],0,"Sem vírgulas, a oração é RESTRITIVA: limita o grupo aos que estudaram."],
  ["Qual palavra é um pronome relativo capaz de iniciar oração adjetiva?",["cujo","embora","portanto","contudo"],0,"CUJO é pronome RELATIVO e indica posse."],
  ["Complete corretamente: A escola, ___ diretora é nova, reformou a quadra.",["cuja","cuja a","que a","onde"],0,"CUJA concorda com diretora e NÃO aceita artigo depois."],
  ["A Declaração Universal dos Direitos Humanos foi adotada pela ONU em:",["1948","1888","1988","2001"],0,"Foi proclamada em 1948, logo após a Segunda Guerra Mundial."],
  ["Segundo a Declaração Universal dos Direitos Humanos, todos os seres humanos nascem:",["Livres e iguais em dignidade e direitos","Com direitos diferentes conforme o país","Sem direitos até a maioridade","Iguais apenas diante da religião"],0,"É o 1º artigo: LIVRES e IGUAIS em DIGNIDADE e DIREITOS."],
  ["Qual frase está de acordo com a norma-padrão?",["Faz dois anos que me mudei.","Fazem dois anos que me mudei.","Houveram muitos problemas.","Haviam muitos alunos no pátio."],0,"FAZER indicando tempo é IMPESSOAL e fica no SINGULAR."],
  ["Complete: ___ muitas pessoas na audiência pública.",["Havia","Haviam","Houveram","Existia"],0,"HAVER com sentido de existir é impessoal: fica no SINGULAR."],
  ["Em Existem leis que protegem os animais, o verbo existir está no plural porque:",["Concorda com o sujeito leis","É um verbo impessoal","Concorda com animais","Sempre fica no plural"],0,"Diferente de haver, EXISTIR tem SUJEITO e concorda com ele: leis existem."],
  ["Complete: Os Estados Unidos ___ a proposta.",["aprovaram","aprovou","aprovamos","aprovo"],0,"Nome próprio no plural com ARTIGO no plural leva o verbo ao PLURAL."],
  ["Complete: Fui eu que ___ o projeto.",["escrevi","escreveu","escreveram","escrevemos"],0,"Com que, o verbo concorda com o pronome anterior: EU ESCREVI."],
  ["O capítulo Todos pela Cidadania trabalha textos ligados a:",["Direitos, deveres e participação social","Receitas e cardápios","Contos de fadas","Regras de esportes"],0,"CIDADANIA envolve DIREITOS, DEVERES e PARTICIPAÇÃO, como na DUDH e no projeto de lei."]
 ]},
 cie:{nome:"Ciências",ic:"leaf",data:"05/11",desc:"Biologia da conservação e políticas ambientais",q:[
  ["A Biologia da Conservação estuda:",["Como proteger a biodiversidade e evitar extinções","Apenas a anatomia humana","A formação das rochas","O movimento dos planetas"],0,"Ela busca PROTEGER a BIODIVERSIDADE."],
  ["A principal causa de perda de biodiversidade no mundo é:",["A destruição e a fragmentação dos habitats","O excesso de chuva","A rotação da Terra","As fases da Lua"],0,"Desmatamento e ocupação do solo destroem HABITATS."],
  ["Uma espécie ENDÊMICA é aquela que:",["Só ocorre naturalmente em uma região","Vive em todos os continentes","Foi trazida de outro país","Já está extinta"],0,"ENDÊMICA = exclusiva de uma região, como muitas espécies da Mata Atlântica."],
  ["Uma espécie exótica INVASORA é aquela que:",["Foi levada para fora de sua região e prejudica as espécies nativas","Nasceu no próprio ambiente","Está protegida por lei","Só vive em zoológicos"],0,"Ex.: o javali e o coral-sol no Brasil são espécies INVASORAS."],
  ["O que é fragmentação de habitat?",["A divisão de uma área natural em pedaços isolados","O crescimento de uma floresta","A união de dois rios","A formação de um vulcão"],0,"Na FRAGMENTAÇÃO, a mata vira ilhas isoladas por estradas, pastos e cidades."],
  ["Corredores ecológicos servem para:",["Ligar fragmentos de mata e permitir o deslocamento dos animais","Construir rodovias","Drenar rios","Separar populações para sempre"],0,"Os CORREDORES reconectam áreas e mantêm a troca genética."],
  ["Bancos de sementes e zoológicos são exemplos de conservação:",["Ex situ, fora do ambiente natural","In situ, no ambiente natural","Agrícola","Industrial"],0,"EX SITU = conservação FORA do habitat natural."],
  ["A Lista Vermelha da IUCN serve para:",["Classificar as espécies conforme o risco de extinção","Listar animais domésticos","Registrar preços de madeira","Indicar áreas de mineração"],0,"A LISTA VERMELHA mostra o grau de AMEAÇA de cada espécie."],
  ["O mico-leão-dourado, que saiu da beira da extinção graças à conservação, vive na:",["Mata Atlântica","Caatinga","Antártida","Savana africana"],0,"Ele é ENDÊMICO da MATA ATLÂNTICA do Rio de Janeiro."],
  ["No Brasil, a lei que organiza as unidades de conservação criou o:",["SNUC (Sistema Nacional de Unidades de Conservação)","SUS","ENEM","IBGE"],0,"O SNUC (Lei 9.985/2000) divide as UCs em proteção integral e uso sustentável."],
  ["Um Parque Nacional é uma unidade de conservação de:",["Proteção integral","Uso industrial","Mineração livre","Loteamento urbano"],0,"Parques Nacionais são de PROTEÇÃO INTEGRAL: permitem visitação e pesquisa, não exploração."],
  ["O órgão federal que administra as unidades de conservação federais é o:",["ICMBio","Detran","Banco Central","INSS"],0,"O ICMBio cuida das UCs federais; o IBAMA atua na fiscalização ambiental."],
  ["Políticas públicas ambientais são:",["Ações e leis do governo para proteger o meio ambiente","Opiniões pessoais sobre a natureza","Propagandas de empresas","Regras de jogos"],0,"POLÍTICAS PÚBLICAS são decisões do ESTADO: leis, programas e fiscalização."],
  ["A Política Nacional de Resíduos Sólidos (2010) criou a logística reversa, que obriga:",["Fabricantes a recolher produtos após o uso, como pilhas e pneus","Cidadãos a queimar o lixo","O fim da coleta seletiva","A importação de lixo"],0,"Na LOGÍSTICA REVERSA, o produto VOLTA ao fabricante para destino correto."],
  ["As APPs (Áreas de Preservação Permanente) protegem, por exemplo:",["As margens de rios e as encostas íngremes","Os estacionamentos","As plantações de soja","As praças urbanas"],0,"APPs preservam MATA CILIAR e ENCOSTAS, evitando erosão e enchentes."],
  ["O Acordo de Paris, de 2015, tem como meta principal:",["Reduzir emissões e limitar o aquecimento global","Proibir a pesca no mundo","Criar uma moeda única","Explorar petróleo na Antártida"],0,"Os países se comprometem a LIMITAR O AQUECIMENTO GLOBAL."],
  ["Antes de grandes obras, como uma usina, exige-se o EIA/RIMA, que é:",["O estudo de impacto ambiental e seu relatório","Um imposto sobre a obra","Uma licença de trânsito","Um contrato de trabalho"],0,"O EIA/RIMA avalia os IMPACTOS AMBIENTAIS antes do licenciamento."],
  ["Desenvolvimento sustentável é:",["Atender às necessidades atuais sem comprometer as gerações futuras","Crescer a qualquer custo","Parar toda a produção","Usar só recursos não renováveis"],0,"SUSTENTÁVEL = garantir o presente SEM PREJUDICAR O FUTURO."]
 ]},
 lit:{nome:"Literatura",ic:"book",data:"05/11",desc:"O Alienista, de Machado de Assis",q:[
  ["Quem escreveu O Alienista?",["Machado de Assis","José de Alencar","Monteiro Lobato","Carlos Drummond de Andrade"],0,"O Alienista é de MACHADO DE ASSIS, publicado em 1882."],
  ["O protagonista Simão Bacamarte é:",["Um médico dedicado à ciência","Um padre da vila","Um barbeiro revoltado","Um vereador corrupto"],0,"SIMÃO BACAMARTE é um MÉDICO obcecado pelo estudo da mente."],
  ["A história se passa na vila de:",["Itaguaí","Ouro Preto","Paraty","Petrópolis"],0,"Tudo acontece em ITAGUAÍ, no interior do Rio de Janeiro."],
  ["Onde Bacamarte estudou antes de voltar ao Brasil?",["Na Europa, em Coimbra e Pádua","Em Itaguaí mesmo","Nos Estados Unidos","Em Salvador"],0,"Ele estudou em COIMBRA e PÁDUA e voltou para se dedicar à ciência."],
  ["Como se chama o hospício que Bacamarte funda?",["Casa Verde","Casa Amarela","Solar dos Loucos","Casa Grande"],0,"A CASA VERDE tinha esse nome pela cor das janelas."],
  ["Quem é a esposa de Simão Bacamarte?",["D. Evarista","Capitu","Iracema","D. Plácida"],0,"D. EVARISTA foi escolhida por ele por razões fisiológicas, não por beleza."],
  ["Crispim Soares, amigo fiel de Bacamarte, era:",["O boticário da vila","O barbeiro","O padre","O juiz"],0,"CRISPIM SOARES era o BOTICÁRIO e vivia concordando com o alienista."],
  ["A revolta contra a Casa Verde, liderada pelo barbeiro Porfírio, ficou conhecida como:",["Revolta dos Canjicas","Revolta da Vacina","Inconfidência Mineira","Revolta dos Alfaiates"],0,"Porfírio tinha o apelido de Canjica, daí REVOLTA DOS CANJICAS."],
  ["Depois de tomar o poder na vila, o barbeiro Porfírio:",["Fez acordo com Bacamarte e manteve a Casa Verde","Destruiu a Casa Verde","Virou médico","Mandou Bacamarte para o Rio"],0,"Porfírio negociou com o alienista: a revolta mostra o OPORTUNISMO político."],
  ["D. Evarista foi internada na Casa Verde porque:",["Passou a noite indecisa entre dois colares","Agrediu um vizinho","Fugiu para o Rio","Recusou-se a ir à missa"],0,"Ela não conseguia escolher entre o colar de granadas e o de safiras: Bacamarte viu nisso MANIA."],
  ["Em certo momento, Bacamarte solta os internos e passa a internar:",["Pessoas de equilíbrio perfeito das faculdades mentais","Apenas crianças","Somente estrangeiros","Os animais da vila"],0,"Ele INVERTE a teoria: o anormal passa a ser o EQUILÍBRIO PERFEITO."],
  ["Como termina a narrativa?",["Bacamarte interna a si mesmo na Casa Verde e morre meses depois","Bacamarte vira prefeito","A Casa Verde vira escola","Bacamarte foge para Portugal"],0,"Concluindo que só ele era perfeito, INTERNA A SI MESMO e morre 17 meses depois."],
  ["O narrador de O Alienista:",["Narra em 3ª pessoa e diz se basear nas crônicas da vila","É o próprio Bacamarte em 1ª pessoa","É D. Evarista","Não existe narrador"],0,"Narrador em 3ª PESSOA, que cita as CRÔNICAS de Itaguaí, com tom irônico."],
  ["Uma das principais críticas da obra é:",["Ao poder da ciência usado de forma autoritária","Aos esportes da época","À vida no campo","Às histórias de amor românticas"],0,"Machado critica a CIÊNCIA AUTORITÁRIA e questiona o limite entre RAZÃO e LOUCURA."],
  ["O Alienista pertence a qual escola literária?",["Realismo","Romantismo","Arcadismo","Modernismo"],0,"Machado é o grande nome do REALISMO brasileiro: ironia e análise crítica."],
  ["Quem é Padre Lopes na narrativa?",["O vigário de Itaguaí","O médico assistente","O líder da revolta","O pai de Bacamarte"],0,"PADRE LOPES é o VIGÁRIO, que também acaba internado por suas virtudes."]
 ]},
 dir:{nome:"Direito na Escola",ic:"scale",data:"06/11",desc:"Art. 5º da Constituição: direitos individuais e coletivos",q:[
  ["O caput do Art. 5º da Constituição de 1988 afirma que todos são:",["Iguais perante a lei, sem distinção de qualquer natureza","Iguais apenas se forem eleitores","Diferentes conforme a renda","Iguais somente dentro da escola"],0,"É o PRINCÍPIO DA IGUALDADE: todos são IGUAIS PERANTE A LEI."],
  ["O Art. 5º garante a inviolabilidade do direito:",["À vida, à liberdade, à igualdade, à segurança e à propriedade","Apenas à propriedade","Apenas ao lazer","Somente ao voto"],0,"São os cinco direitos do caput: VIDA, LIBERDADE, IGUALDADE, SEGURANÇA e PROPRIEDADE."],
  ["Segundo o inciso I, homens e mulheres:",["São iguais em direitos e obrigações","Têm direitos diferentes","Só são iguais no trabalho","Dependem da idade"],0,"HOMENS e MULHERES são IGUAIS em direitos e obrigações."],
  ["Ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de:",["Lei","Ordem de um vizinho","Costume familiar","Regra de rede social"],0,"É o PRINCÍPIO DA LEGALIDADE: só a LEI pode obrigar."],
  ["O Art. 5º proíbe:",["A tortura e o tratamento desumano ou degradante","A liberdade de expressão","A prática de religiões","As reuniões pacíficas"],0,"Ninguém será submetido a TORTURA (inciso III)."],
  ["A livre manifestação do pensamento é garantida, mas é vedado:",["O anonimato","O uso de jornais","Falar em público","Discordar do governo"],0,"Podemos nos expressar, mas assumindo a AUTORIA: o ANONIMATO é vedado."],
  ["A liberdade de consciência e de crença significa que:",["Cada pessoa pode ter ou não ter uma religião","Todos devem seguir a mesma religião","Só religiões antigas são permitidas","O Estado escolhe a religião de cada um"],0,"É livre a CRENÇA, e protegidos os locais de CULTO."],
  ["Segundo o Art. 5º, a casa é:",["Asilo inviolável do indivíduo","Propriedade do Estado","Aberta a qualquer visitante","Local público"],0,"A CASA é INVIOLÁVEL, salvo flagrante, desastre, socorro ou ordem judicial durante o dia."],
  ["O direito de reunião pacífica, sem armas, em locais abertos ao público:",["Não depende de autorização, só de aviso prévio à autoridade","É proibido","Só vale para partidos","Exige pagamento de taxa"],0,"Reunir-se é um DIREITO COLETIVO: basta AVISO PRÉVIO."],
  ["Qual destes é um direito COLETIVO previsto no Art. 5º?",["Liberdade de associação para fins lícitos","Direito à própria imagem","Sigilo da correspondência","Inviolabilidade da casa"],0,"ASSOCIAÇÃO e REUNIÃO são exercidas em GRUPO: direitos coletivos."],
  ["Segundo a Constituição, a prática do racismo é:",["Crime inafiançável e imprescritível","Infração leve","Assunto apenas moral","Permitida em certos casos"],0,"RACISMO é crime INAFIANÇÁVEL e IMPRESCRITÍVEL (inciso XLII)."],
  ["O habeas corpus protege:",["A liberdade de locomoção (ir e vir)","O direito autoral","A herança","O direito ao voto"],0,"HABEAS CORPUS protege quem sofre prisão ou ameaça ILEGAL à LIBERDADE de ir e vir."],
  ["O habeas data serve para:",["Conhecer ou corrigir informações pessoais em registros públicos","Pedir aumento de salário","Mudar de cidade","Registrar uma empresa"],0,"HABEAS DATA garante acesso aos próprios DADOS."],
  ["Ninguém será considerado culpado até:",["O trânsito em julgado da sentença penal condenatória","Ser acusado nas redes sociais","A polícia chegar","A primeira audiência"],0,"É a PRESUNÇÃO DE INOCÊNCIA (inciso LVII)."],
  ["Sobre a pena de morte, o Art. 5º diz que:",["Não haverá, salvo em caso de guerra declarada","É permitida para qualquer crime","Depende de cada estado","É decidida por votação popular"],0,"Não há PENA DE MORTE no Brasil, exceto em GUERRA DECLARADA."],
  ["Os direitos e garantias individuais não podem ser abolidos nem por emenda. Por isso são chamados de:",["Cláusulas pétreas","Medidas provisórias","Decretos municipais","Leis ordinárias"],0,"Os direitos individuais são CLÁUSULAS PÉTREAS (Art. 60, §4º)."]
 ]},
 fil:{nome:"Filosofia",ic:"heart",data:"06/11",desc:"Viver com justiça: Leibniz, Voltaire, More, Rousseau e Rawls",q:[
  ["Leibniz defendia que vivemos:",["No melhor dos mundos possíveis","Num mundo sem sentido","Num mundo totalmente injusto","Num sonho"],0,"Para LEIBNIZ, Deus criou o MELHOR DOS MUNDOS POSSÍVEIS, mesmo com o mal."],
  ["Voltaire criticou o otimismo de Leibniz com ironia no livro:",["Cândido, ou o Otimismo","A República","Utopia","O Príncipe"],0,"Em CÂNDIDO, o personagem Pangloss repete que tudo vai bem, mesmo diante de desgraças."],
  ["Qual acontecimento real abalou o otimismo e inspirou Voltaire?",["O terremoto de Lisboa de 1755","A queda do Muro de Berlim","A Revolução Russa","A chegada à Lua"],0,"O TERREMOTO DE LISBOA (1755) matou milhares e fez Voltaire questionar o otimismo."],
  ["A pergunta Está bom como está? convida a:",["Questionar o conformismo e pensar em mudanças","Aceitar tudo sem refletir","Desistir de agir","Obedecer sem pensar"],0,"A filosofia propõe olhar CRÍTICO: aceitar as injustiças não é neutro."],
  ["Voltaire escreveu o Tratado sobre a Tolerância defendendo:",["O respeito a crenças diferentes","A perseguição religiosa","O fim da filosofia","A monarquia absoluta"],0,"Após o caso Jean Calas, Voltaire defendeu a TOLERÂNCIA religiosa."],
  ["Voltaire foi um importante pensador do:",["Iluminismo","Feudalismo","Renascimento medieval","Romantismo"],0,"Voltaire é um dos nomes do ILUMINISMO, que valorizava a razão e a liberdade."],
  ["Thomas More escreveu Utopia, obra que descreve:",["Uma ilha imaginária com uma sociedade ideal","Uma guerra real","A vida de um rei","Um manual de economia"],0,"UTOPIA (1516) imagina uma sociedade justa para criticar a Inglaterra da época."],
  ["A palavra utopia, criada por More, significa algo como:",["Lugar que não existe","Lugar perfeito que existe","Cidade grande","Terra natal"],0,"U-TOPIA = NÃO-LUGAR: um ideal que nos ajuda a criticar o presente."],
  ["Para Rousseau, a origem da desigualdade entre os homens está:",["Na propriedade privada","Na natureza humana má","Na vontade de Deus","No clima"],0,"Para ROUSSEAU, a desigualdade começa com a PROPRIEDADE PRIVADA."],
  ["Rousseau afirmava que o ser humano:",["Nasce bom e é corrompido pela sociedade","Nasce mau e precisa ser punido","Não tem natureza","É igual aos animais em tudo"],0,"O ser humano NASCE BOM; a SOCIEDADE o corrompe."],
  ["Em O Contrato Social, Rousseau defende que as leis devem expressar a:",["Vontade geral","Vontade do rei","Vontade dos mais ricos","Vontade de um só líder"],0,"A VONTADE GERAL busca o bem comum de todos."],
  ["John Rawls é conhecido pela obra:",["Uma Teoria da Justiça","O Leviatã","Cândido","A Utopia"],0,"RAWLS publicou UMA TEORIA DA JUSTIÇA em 1971."],
  ["O véu da ignorância, de Rawls, propõe escolher regras da sociedade:",["Sem saber que posição ocuparíamos nela","Conhecendo nossa riqueza","Só pensando em nós mesmos","Sorteando um líder"],0,"Sem saber se seremos ricos ou pobres, escolheríamos regras JUSTAS para todos."],
  ["Pelo princípio da diferença de Rawls, desigualdades só são aceitáveis se:",["Beneficiarem os menos favorecidos","Beneficiarem os mais ricos","Forem herdadas","Forem decididas pela força"],0,"Desigualdades só se justificam se ajudarem OS MENOS FAVORECIDOS."],
  ["Kant escreveu À Paz Perpétua, propondo:",["Acordos entre nações para evitar guerras","A guerra como solução","O fim das leis","Um império mundial pela força"],0,"KANT defende a PAZ construída por acordos e instituições internacionais."],
  ["Para Hobbes, sem um Estado, os seres humanos viveriam numa:",["Guerra de todos contra todos","Harmonia perfeita","Ilha utópica","Sociedade de anjos"],0,"Para HOBBES, o estado de natureza é uma GUERRA DE TODOS CONTRA TODOS."]
 ]},
 art:{nome:"Arte",ic:"music",data:"06/11",desc:"A arte do nosso tempo: dança, corpo e performance",q:[
  ["A arte contemporânea costuma valorizar principalmente:",["A ideia, o processo e a participação do público","Apenas a cópia perfeita da realidade","Somente pinturas a óleo","Regras fixas da academia"],0,"Na arte CONTEMPORÂNEA, o CONCEITO e a experiência importam tanto quanto o objeto."],
  ["Numa PERFORMANCE, a obra de arte é:",["A ação ao vivo, feita com o corpo do artista","Um quadro pendurado","Uma estátua de mármore","Um livro"],0,"PERFORMANCE: o CORPO e a AÇÃO são a própria obra."],
  ["Uma INSTALAÇÃO artística é uma obra que:",["Ocupa um espaço e envolve o público","Cabe numa moldura pequena","É só música","É sempre digital"],0,"A INSTALAÇÃO transforma um ESPAÇO para ser vivido pelo público."],
  ["O marco do Modernismo no Brasil foi:",["A Semana de Arte Moderna de 1922","A chegada da família real em 1808","A Bienal de 2026","A Proclamação da República"],0,"A SEMANA DE 22, em São Paulo, rompeu com a arte acadêmica."],
  ["Isadora Duncan é lembrada na dança moderna por:",["Dançar descalça, com movimentos livres e naturais","Criar o balé clássico","Inventar o hip-hop","Dançar só em grupo"],0,"Ela rompeu com o balé: DESCALÇA e com MOVIMENTOS LIVRES."],
  ["Pina Bausch ficou famosa por criar a:",["Dança-teatro","Capoeira","Valsa","Quadrilha"],0,"PINA BAUSCH misturou dança e teatro: a DANÇA-TEATRO."],
  ["Danças: no plural destaca que:",["Existem muitos estilos, do tradicional ao contemporâneo","Só o balé é dança","Toda dança é igual","Dança não é arte"],0,"A dança é DIVERSA: frevo, maracatu, breaking, balé, dança contemporânea..."],
  ["Qual destas é uma dança tradicional brasileira?",["Maracatu","Tango","Flamenco","Valsa vienense"],0,"O MARACATU, de Pernambuco, é uma dança tradicional afro-brasileira."],
  ["O breaking, dança urbana nascida no hip-hop, estreou como esporte olímpico em:",["Paris 2024","Rio 2016","Tóquio 2020","Londres 2012"],0,"O BREAKING estreou nos Jogos de PARIS 2024."],
  ["A ideia de que o corpo guarda histórias significa que:",["Gestos e danças carregam memórias e culturas","O corpo não comunica nada","Só a escrita guarda história","A dança é só exercício"],0,"O CORPO carrega MEMÓRIA: gestos aprendidos com a família, a comunidade e a cultura."],
  ["Recriar uma dança tradicional com linguagem contemporânea é um exemplo de:",["O passado no presente","Cópia proibida","Arte sem conceito","Fim da tradição"],0,"Unir tradição e linguagem atual é trazer O PASSADO para O PRESENTE."],

 app.innerHTML=`<section class="card stack pais pop" style="margin-top:20px"><h2 class="sec">Área da administradora</h2>
  <p class="note">Aqui a administradora atualiza as perguntas quando sai um novo rol de conteúdos.</p>
  <label for="ga">Senha da administradora</label><input type="password" id="ga" autocomplete="current-password" autocapitalize="off" spellcheck="false">
  <p class="err" id="ge" hidden></p>
  <p class="hint" id="gh" hidden>A Silvia pediu para lembrar: é o nome do site.</p>
  <div class="row"><button class="link" id="gl">Lembrar senha</button><button class="go ghost" id="gv">Voltar</button><button class="go" id="go">Entrar</button></div></section>`;
 const er=document.getElementById('ge');
 const go=async()=>{const a=document.getElementById('ga').value.trim().toLowerCase();
  if((await hashPin(a,'adm'))===ADMHASH){SFX.level();pais()}else{er.hidden=false;er.textContent='Senha errada.';SFX.wrong()}};
 document.getElementById('go').onclick=go;document.getElementById('ga').onkeydown=e=>{if(e.key==='Enter')go()};document.getElementById('gv').onclick=home;
 document.getElementById('gl').onclick=()=>{document.getElementById('gh').hidden=false};
}
async function pais(){
 SCREEN='pais';
 const loc=localMap();
 app.innerHTML=`<section class="card stack pais pop"><h2 class="sec">Área da administradora: novos conteúdos</h2>
  <p class="note">Saiu um novo rol de conteúdos? Envie a foto do comunicado ou cole o texto. O jogo cria perguntas novas para cada matéria que aparecer. As outras matérias continuam como estão.</p>
  <div class="stack" id="fotoBox" hidden><label for="foto">Foto do comunicado (opcional)</label><input type="file" id="foto" accept="image/*"></div>
  <label for="txt">Conteúdos (cole ou digite)</label>
  <textarea id="txt" placeholder="Ex.: MATEMÁTICA – Unidade 12: Multiplicação, dobro e triplo. Prova: 02/12&#10;CIÊNCIAS – Unidade 08: O ciclo da água..."></textarea>
  <p class="status" id="st" hidden></p><p class="err" id="er" hidden></p>
  <div class="row"><button class="go ghost" id="vt">Voltar ao jogo</button><button class="go" id="gr">Criar perguntas</button></div>
  <div id="prev"></div>
  <hr style="border:none;border-top:2px solid var(--line);width:100%">
  <p class="note">Matérias com conteúdo novo: ${MKEYS.filter(k=>S[k].novo).map(k=>S[k].nome).join(', ')||'nenhuma ainda (usando o comunicado de novembro do 9º ano)'}.</p>
  <div class="row" style="justify-content:flex-start"><button class="link" id="rst">Voltar às perguntas originais de novembro</button></div>
 </section>`;
 document.getElementById('vt').onclick=home;
 document.getElementById('rst').onclick=confirmRestore;
 let sample=null;
 try{if(window.claude&&claude.use)sample=await claude.use("sample")}catch(e){}
 const st=document.getElementById('st'),er=document.getElementById('er'),gr=document.getElementById('gr');
 if(!sample){gr.disabled=true;er.hidden=false;er.textContent='A criação automática de perguntas não está disponível neste aparelho. Mande o novo comunicado para o Claude no chat que ele atualiza o jogo para você.';return}
 try{const lim=await sample.limits();if(lim&&lim.images)document.getElementById('fotoBox').hidden=false}catch(e){}
 gr.onclick=async()=>{
  const txt=document.getElementById('txt').value.trim(),f=document.getElementById('foto').files;
  er.hidden=true;
  if(!txt&&!(f&&f.length)){er.hidden=false;er.textContent='Envie uma foto ou escreva os conteúdos primeiro.';return}
  gr.disabled=true;st.hidden=false;st.textContent='Criando as perguntas... isso pode levar até 1 minuto.';
  const nomes=MKEYS.map(k=>`${k} = ${ORIG[k].nome}`).join('; ');
  const prompt=`Você cria perguntas de estudo para adolescentes de 14 e 15 anos do 9º ano do Ensino Fundamental no Brasil.
${f&&f.length?'A imagem anexada é um comunicado da escola com os conteúdos das próximas avaliações. ':''}Use os conteúdos abaixo${f&&f.length?' e os da imagem':''}.
Matérias aceitas (use estas chaves): ${nomes}. Ignore matérias que não estejam na lista e matérias sem conteúdo informado.
Para cada matéria encontrada, crie 20 perguntas de múltipla escolha sobre exatamente esses conteúdos:
- linguagem clara e direta, adequada para 14 e 15 anos;
- metade fáceis e metade mais desafiadoras (interpretar, aplicar, problemas de 2 passos), sempre no nível do 9º ano;
- todas diferentes entre si, sem repetir ideias;
- 4 alternativas curtas, só uma correta, as erradas plausíveis;
- "c" é o índice (0 a 3) da correta; varie a posição da correta;
- "e" é uma explicação objetiva de 1 frase, com a palavra-chave da resposta em MAIÚSCULAS;
- não invente fatos; confira cada resposta.
Se houver data da avaliação da matéria, coloque em "data" no formato DD/MM. Em "desc" escreva os temas em até 7 palavras.
Responda somente com JSON neste formato: {"materias":{"mat":{"data":"02/12","desc":"Multiplicação, dobro e triplo","q":[{"t":"Quanto é 2 + 2?","o":["3","4","5","6"],"c":1,"e":"2 + 2 = 4, então a resposta é QUATRO."}]}}}

Conteúdos informados:
${txt||'(ver imagem)'}`;
  try{
   const opts={modelTier:"complex"};if(f&&f.length)opts.images=[f[0]];
   const out=await sample.json(prompt,opts);
   const res={};const M=(out&&out.materias)||{};
   for(const k of MKEYS){const m=M[k];if(!m||!Array.isArray(m.q))continue;const q=m.q.filter(validQ).map(x=>({t:x.t.trim(),o:x.o.map(o=>o.trim()),c:x.c,e:x.e.trim()}));
    if(q.length>=4)res[k]={q,data:typeof m.data==='string'&&/^\d{2}\/\d{2}$/.test(m.data)?m.data:ORIG[k].data,desc:typeof m.desc==='string'?m.desc.slice(0,60):ORIG[k].desc}}
   st.hidden=true;gr.disabled=false;
   if(!Object.keys(res).length){er.hidden=false;er.textContent='Não encontrei conteúdos das matérias do jogo. Confira o texto ou a foto e tente de novo.';return}
   showPreview(res);
  }catch(e){st.hidden=true;gr.disabled=false;er.hidden=false;
   er.textContent=e&&e.code==='not_granted'?'É preciso permitir que o jogo use o Claude para criar as perguntas.':e&&e.code==='rate_limited'?'Muitas tentativas seguidas. Espere um minutinho e tente de novo.':'Não consegui criar as perguntas agora. Tente de novo em instantes.'}
 };
}
function showPreview(res){
 const box=document.getElementById('prev');
 box.innerHTML=`<div class="stack"><h2 class="sec">Confira antes de salvar</h2><div class="gen">${Object.entries(res).map(([k,m])=>`<div class="g" style="--c:var(--${k})"><h3>${ORIG[k].nome} · ${m.q.length} perguntas</h3><small>Prova: ${esc(m.data)} · ${esc(m.desc)}</small>
  <ol>${m.q.slice(0,3).map(q=>`<li>${esc(q.t)} <b>Resposta: ${esc(q.o[q.c])}</b></li>`).join('')}</ol>${m.q.length>3?`<small>e mais ${m.q.length-3} perguntas</small>`:''}</div>`).join('')}</div>
  <p class="err" id="se" hidden></p>
  <div class="row"><button class="go ghost" id="dc">Descartar</button><button class="go" id="sv">Salvar no jogo</button></div></div>`;
 box.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
 document.getElementById('dc').onclick=()=>{box.innerHTML=''};
 document.getElementById('sv').onclick=async()=>{
  const sv=document.getElementById('sv');sv.disabled=true;
  const m={...localMap(),...res};
  try{localStorage.setItem(LKEY,JSON.stringify(m))}catch(e){}
  let shared=false;
  if(DBC){try{for(const [k,v] of Object.entries(res))await DBC.doc("conteudo/"+k).set({...v,updated:Date.now()});shared=true}catch(e){}}
  applyContent(m);
  box.innerHTML=`<p class="status">Pronto! ${Object.keys(res).map(k=>ORIG[k].nome).join(', ')} ${Object.keys(res).length>1?'foram atualizadas':'foi atualizada'}. ${shared?'As perguntas novas aparecem em todos os aparelhos que abrirem o jogo.':'As perguntas novas foram salvas neste aparelho.'}</p>`;
 };
}
function confirmRestore(){
 app.innerHTML=`<section class="card end pop"><h2>Voltar às perguntas originais?</h2><p>As perguntas criadas na Área da administradora serão apagadas. O personagem e os níveis do jogador continuam.</p>
 <div class="row" style="justify-content:center"><button class="go ghost" id="no">Não, voltar</button><button class="go danger" id="yes">Sim, voltar às originais</button></div></section>`;
 document.getElementById('no').onclick=pais;
 document.getElementById('yes').onclick=async()=>{try{localStorage.removeItem(LKEY)}catch(e){}
  if(DBC){for(const k of MKEYS){try{await DBC.doc("conteudo/"+k).delete()}catch(e){}}}
  applyContent({});pais()};
}

PID=null;G=null;{const t0=loadTheme();applyTheme(t0||'royale');t0?maker(false):themePick(()=>maker(false))}
</script>



</body></html>
