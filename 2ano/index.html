<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Desafio do 2º Ano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: "aventura" em uma coluna; arena de batalha ilustrada em cima, perguntas embaixo */
:root{
  --bg:#eaf4ff; --paper:#ffffff; --ink:#1b2a4a; --muted:#5a6a88; --line:#cfe0f5;
  --por:#e8505b; --mat:#2f80ed; --cie:#27ae60; --his:#9b51e0; --geo:#f2994a; --fil:#d6336c; --ing:#0f9fb5; --art:#c2410c;
  --ok:#1f9d55; --okbg:#dcf7e6; --bad:#d6334a; --badbg:#ffe1e5; --star:#f5b301; --xp:#7c4dff;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a2e; --paper:#1a2540; --ink:#eef3ff; --muted:#a6b4d4; --line:#2c3a5e;
  --okbg:#173d2a; --badbg:#47202a; --ok:#5fd394; --bad:#ff7a8c; --xp:#a98bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a2e; --paper:#1a2540; --ink:#eef3ff; --muted:#a6b4d4; --line:#2c3a5e;
  --okbg:#173d2a; --badbg:#47202a; --ok:#5fd394; --bad:#ff7a8c; --xp:#a98bff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background-image:radial-gradient(var(--line) 1.5px,transparent 1.5px);background-size:22px 22px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(30px,7vw,48px);font-weight:800}
h1 span{color:var(--xp)}
h2.sec{font-size:24px}
.sub{color:var(--muted);margin:4px 0 0;font-weight:700}
.card{background:var(--paper);border-radius:26px;padding:20px;border:3px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.tip{color:var(--muted);font-size:15px;font-weight:700;text-align:center;margin:0}
.link{all:unset;cursor:pointer;color:var(--muted);font-weight:800;font-size:15px;text-decoration:underline}
.link:focus-visible{outline:3px solid var(--ink);border-radius:4px}
.go{all:unset;cursor:pointer;background:var(--c,var(--xp));color:#fff;font-family:var(--display);font-weight:800;font-size:22px;
  border-radius:18px;padding:12px 26px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.go:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.go[disabled]{opacity:.45;cursor:not-allowed}
.go.ghost{background:var(--paper);color:var(--ink);border:3px solid var(--line);box-shadow:none}
.go.danger{background:var(--bad)}
svg{display:block}
/* criador */
.maker{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.preview{position:sticky;top:12px;background:radial-gradient(120% 60% at 50% 115%,rgba(0,0,0,.25),transparent 70%),linear-gradient(#6fbdf0,#e2f4ff 60%,#7cc35e 60%,#3f7f2e);border-radius:24px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line)}
.preview .big{width:100%;aspect-ratio:1}
.preview .big svg,.preview .eg svg{width:100%;height:100%}
.preview .cap{font-weight:800;font-size:14px;color:#1b2a4a;text-align:center}
.preview .eg{width:64px;height:64px}
.preview .nm{font-family:var(--display);font-weight:800;font-size:26px;color:#1b2a4a}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.ch{all:unset;cursor:pointer;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:15px;min-width:76px}
.ch svg{width:64px;height:64px}
.ch.sel{border-color:var(--xp);background:var(--paper);box-shadow:0 4px 0 var(--xp)}
.ch:focus-visible,.sw:focus-visible,.wear:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.pw svg{width:40px;height:40px}
.sw{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 3px var(--line)}
.sw.sel{box-shadow:0 0 0 4px var(--xp)}
input[type=text]{font:inherit;font-weight:800;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input[type=text]:focus{outline:none;border-color:var(--xp)}
.step{font-family:var(--display);font-weight:800;font-size:21px}
/* casa */
.hero{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:18px;align-items:center}
.habitat{background:radial-gradient(120% 60% at 50% 115%,rgba(0,0,0,.25),transparent 70%),linear-gradient(#6fbdf0,#e2f4ff 60%,#7cc35e 60%,#3f7f2e);border-radius:24px;aspect-ratio:1;position:relative;overflow:hidden}
.habitat svg{width:100%;height:100%}
.habitat::before{content:"";position:absolute;left:12%;top:10%;width:34%;height:12%;background:#fff;border-radius:40px;opacity:.85;box-shadow:70px 18px 0 -6px #fff}
.hero-info{display:flex;flex-direction:column;gap:8px;min-width:0}
.lvl{font-weight:800;color:var(--xp);text-transform:uppercase;letter-spacing:1px;font-size:14px}
.mname{font-size:clamp(30px,6vw,42px)}
.xpbar{height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);border-radius:999px;transition:width .6s}
.xptxt{font-weight:800;font-size:15px;color:var(--muted)}
.album{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.form{background:var(--bg);border-radius:18px;padding:6px;text-align:center;font-weight:800;font-size:13px;border:3px solid var(--line)}
.form svg{width:100%;aspect-ratio:1;height:auto}
.form.lock svg{filter:brightness(0);opacity:.22}
.form.now{border-color:var(--xp)}
.form span{display:block;color:var(--muted)}
.wardrobe{display:flex;gap:10px;flex-wrap:wrap}
.wear{all:unset;cursor:pointer;border:3px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 14px;font-weight:800;font-size:16px}
.wear.sel{border-color:var(--xp);background:var(--paper);box-shadow:0 4px 0 var(--xp)}
.wear[disabled]{cursor:not-allowed;opacity:.5}
.dex{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dex .form{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.subj{all:unset;cursor:pointer;background:var(--paper);border:3px solid var(--c);border-radius:22px;padding:12px;
  display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--c);transition:transform .12s}
.subj:hover{transform:translateY(-3px)}
.subj:active{transform:translateY(3px);box-shadow:0 2px 0 var(--c)}
.subj:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.subj .foe{width:72px;height:72px;flex:none;border-radius:16px;background:var(--c);display:grid;place-items:center}
.subj .foe svg{width:66px;height:66px}
.subj h3{font-size:22px}
.subj small{color:var(--muted);font-weight:700;font-size:14px;display:block}
.date{color:var(--c)!important}
.best{color:var(--star)!important;font-weight:800;letter-spacing:2px}
/* arena */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--c);color:#fff;font-weight:800;border-radius:999px;padding:4px 14px;font-size:15px;letter-spacing:.5px;text-transform:uppercase}
.back{all:unset;cursor:pointer;color:var(--muted);font-weight:800;font-size:16px;padding:6px 4px}
.back:focus-visible{outline:3px solid var(--ink);border-radius:6px}
.arena{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/10;max-height:440px;width:100%;border:3px solid var(--line)}
.arena .pad{position:absolute;border-radius:50%;background:rgba(0,0,0,.16)}
.arena .who{position:absolute}
.arena .who svg{width:100%;height:100%}
#pl{left:2%;bottom:2%;width:42%;aspect-ratio:1}
#en{right:4%;top:8%;width:33%;aspect-ratio:1}
.pad.p1{left:4%;bottom:3%;width:38%;height:12%}
.pad.p2{right:5%;top:34%;width:30%;height:9%}
.hpbox{position:absolute;background:#fff;color:#1b2a4a;border-radius:14px;padding:6px 10px;border:3px solid #1b2a4a;font-weight:800;font-size:clamp(12px,2.6vw,16px);min-width:0;max-width:46%}
.hpbox b{font-family:var(--display);font-size:1.15em}
.hpbox .hp{height:10px;background:#d9dde8;border-radius:999px;overflow:hidden;margin-top:3px;width:clamp(90px,24vw,170px)}
.hpbox .hp i{display:block;height:100%;border-radius:999px;transition:width .5s,background .5s}
#hb1{left:3%;top:5%}
#hb2{right:3%;bottom:6%}
.faint svg{filter:grayscale(1) brightness(.85);transform:rotate(-80deg) translateY(30%);transition:transform .6s,filter .6s}
.proj{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:3}
.proj svg{width:100%;height:100%}
.scene-name{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(255,255,255,.85);color:#1b2a4a;border-radius:999px;padding:2px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .3s}
.q{font-family:var(--display);font-size:clamp(22px,5vw,30px);font-weight:800;margin:2px 0}
.count{color:var(--muted);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{all:unset;cursor:pointer;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:12px 14px;
  font-weight:800;font-size:19px;display:flex;gap:12px;align-items:center}
.opt b{width:34px;height:34px;flex:none;border-radius:10px;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display)}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt:focus-visible{outline:4px solid var(--c);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{border-radius:18px;padding:12px 16px;font-weight:700}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.no{background:var(--badbg);border:2px solid var(--bad)}
.fb strong{font-family:var(--display);font-size:22px;display:block}
.fb .gain{color:var(--xp)}
.stars{font-size:54px;letter-spacing:6px;color:var(--star);text-align:center;line-height:1}
.stars .off{color:var(--line)}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.end .duo{display:flex;gap:10px;justify-content:center;align-items:end}
.end .duo div{width:150px;max-width:42vw;aspect-ratio:1}
.end .duo svg{width:100%;height:100%}
.score{font-family:var(--display);font-size:56px;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.xpgain{font-family:var(--display);font-size:26px;font-weight:800;color:var(--xp)}
/* avisos */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--paper);border:3px solid var(--xp);border-radius:22px;
  padding:8px 16px 8px 8px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:tin .4s}
.toast .t-img{width:70px;height:70px;flex:none;background:radial-gradient(120% 60% at 50% 115%,rgba(0,0,0,.25),transparent 70%),linear-gradient(#6fbdf0,#e2f4ff 60%,#7cc35e 60%,#3f7f2e);border-radius:16px}
.toast .t-img svg{width:100%;height:100%}
.toast b{font-family:var(--display);font-size:22px;color:var(--xp);display:block;line-height:1}
.toast span{font-weight:800}
@keyframes tin{from{transform:translate(-50%,120%)}to{transform:translate(-50%,0)}}
.evo{position:fixed;inset:0;z-index:20;background:rgba(10,14,40,.85);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.evo .box{background:var(--paper);border-radius:28px;padding:22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.evo .st{width:230px;max-width:100%;aspect-ratio:1;margin:0 auto;position:relative;background:radial-gradient(120% 60% at 50% 115%,rgba(0,0,0,.25),transparent 70%),linear-gradient(#6fbdf0,#e2f4ff 60%,#7cc35e 60%,#3f7f2e);border-radius:22px}
.evo .st>div{position:absolute;inset:0}
.evo .st svg{width:100%;height:100%}
.evo .old{animation:fadeOld 2.4s forwards}
.evo .new{opacity:0;animation:fadeNew 2.4s forwards}
.evo .flash{background:#fff;border-radius:22px;opacity:0;animation:flash 2.4s forwards}
@keyframes fadeOld{0%{opacity:1}10%,20%,30%{filter:brightness(4)}15%,25%{filter:brightness(1)}45%,100%{opacity:0}}
@keyframes fadeNew{0%,55%{opacity:0;transform:scale(.5)}75%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes flash{0%,35%{opacity:0}48%{opacity:1}70%,100%{opacity:0}}
.evo h2{font-size:30px;color:var(--xp)}
/* animações do bichinho */
.bob svg{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
.wig svg{animation:wig 1.5s infinite;transform-origin:50% 90%}
@keyframes wig{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-7deg)}85%{transform:rotate(7deg)}92%{transform:rotate(-3deg)}}
.aura{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
.twk{animation:twk 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes twk{0%,100%{opacity:.3;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (max-width:600px){.maker,.hero{grid-template-columns:1fr}.preview{position:static;max-width:280px;margin:0 auto;width:100%}
 .habitat{max-width:260px;width:100%;margin:0 auto}.hero-info{text-align:center;align-items:center}.dex{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.evo .new{opacity:1}.evo .old,.evo .flash{display:none}}
.snd{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.snd button{all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid var(--xp);display:grid;place-items:center;box-shadow:0 4px 0 var(--xp);color:var(--xp)}
.snd button[aria-pressed="false"]{border-color:var(--line);box-shadow:0 4px 0 var(--line);color:var(--muted)}
.snd button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.snd svg{width:26px;height:26px}
.snd .x{display:none}.snd button[aria-pressed="false"] .x{display:block}
@media (max-width:600px){header{padding-right:112px}}

 #fbx .stack{flex-direction:column;align-items:stretch}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ===== animações extras ===== */
.blink{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.arena .who{z-index:1}
.amb span{position:absolute;font-family:var(--display);font-weight:800;line-height:1}
.amb .fall{animation:fall linear infinite}
.amb .rise{animation:rise linear infinite}
.amb .bub{border:2px solid rgba(255,255,255,.95);border-radius:50%;background:rgba(255,255,255,.25)}
.amb .cloud{background:#fff;border-radius:99px;opacity:.8;animation:drift linear infinite}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{all:unset;cursor:pointer;text-align:center;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:12px 0;font-family:var(--display);font-weight:800;font-size:28px;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.alt{font-size:18px;color:var(--muted)}
.key:focus-visible{outline:4px solid var(--ink);outline-offset:2px}

async function hashPin(pin,salt){const txt=salt+':'+pin;
 try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('')}

  code+=k;SFX.click();dots();

 try{if(window.claude&&claude.use)sample=await claude.use("sample")}catch(e){}
 const st=document.getElementById('st'),er=document.getElementById('er'),gr=document.getElementById('gr');
 if(!sample){gr.disabled=true;er.hidden=false;er.textContent='A criação automática de perguntas não está disponível neste aparelho. Mande o novo comunicado para o Claude no chat que ele atualiza o jogo para você.';return}
 try{const lim=await sample.limits();if(lim&&lim.images)document.getElementById('fotoBox').hidden=false}catch(e){}
 gr.onclick=async()=>{
  const txt=document.getElementById('txt').value.trim(),f=document.getElementById('foto').files;
  er.hidden=true;
  if(!txt&&!(f&&f.length)){er.hidden=false;er.textContent='Envie uma foto ou escreva os conteúdos primeiro.';return}
  gr.disabled=true;st.hidden=false;st.textContent='Criando as perguntas... isso pode levar até 1 minuto.';
  const nomes=MKEYS.map(k=>`${k} = ${ORIG[k].nome}`).join('; ');
  const prompt=`Você cria perguntas de estudo para crianças de 8 anos do 2º ano do Ensino Fundamental no Brasil.
${f&&f.length?'A imagem anexada é um comunicado da escola com os conteúdos das próximas avaliações. ':''}Use os conteúdos abaixo${f&&f.length?' e os da imagem':''}.
Matérias aceitas (use estas chaves): ${nomes}. Ignore matérias que não estejam na lista e matérias sem conteúdo informado.
Para cada matéria encontrada, crie 20 perguntas de múltipla escolha sobre exatamente esses conteúdos:
- linguagem simples e curta, adequada para 8 anos;
- metade fáceis e metade mais desafiadoras (interpretar, aplicar, problemas de 2 passos), sempre no nível do 2º ano;
- todas diferentes entre si, sem repetir ideias;
- 4 alternativas curtas, só uma correta, as erradas plausíveis;
- "c" é o índice (0 a 3) da correta; varie a posição da correta;
- "e" é uma explicação gentil de 1 frase, com a palavra-chave da resposta em MAIÚSCULAS;
- não invente fatos; confira cada resposta.
Se houver data da avaliação da matéria, coloque em "data" no formato DD/MM. Em "desc" escreva os temas em até 7 palavras.
Responda somente com JSON neste formato: {"materias":{"mat":{"data":"02/12","desc":"Multiplicação, dobro e triplo","q":[{"t":"Quanto é 2 + 2?","o":["3","4","5","6"],"c":1,"e":"2 + 2 = 4, então a resposta é QUATRO."}]}}}

Conteúdos informados:
${txt||'(ver imagem)'}`;
  try{
   const opts={modelTier:"complex"};if(f&&f.length)opts.images=[f[0]];
   const out=await sample.json(prompt,opts);
   const res={};const M=(out&&out.materias)||{};
   for(const k of MKEYS){const m=M[k];if(!m||!Array.isArray(m.q))continue;const q=m.q.filter(validQ).map(x=>({t:x.t.trim(),o:x.o.map(o=>o.trim()),c:x.c,e:x.e.trim()}));
    if(q.length>=4)res[k]={q,data:typeof m.data==='string'&&/^\d{2}\/\d{2}$/.test(m.data)?m.data:ORIG[k].data,desc:typeof m.desc==='string'?m.desc.slice(0,60):ORIG[k].desc}}
   st.hidden=true;gr.disabled=false;
   if(!Object.keys(res).length){er.hidden=false;er.textContent='Não encontrei conteúdos das matérias do jogo. Confira o texto ou a foto e tente de novo.';return}
   showPreview(res);
  }catch(e){st.hidden=true;gr.disabled=false;er.hidden=false;
   er.textContent=e&&e.code==='not_granted'?'É preciso permitir que o jogo use o Claude para criar as perguntas.':e&&e.code==='rate_limited'?'Muitas tentativas seguidas. Espere um minutinho e tente de novo.':'Não consegui criar as perguntas agora. Tente de novo em instantes.'}
 };
}
function showPreview(res){
 const box=document.getElementById('prev');
 box.innerHTML=`<div class="stack"><h2 class="sec">Confira antes de salvar</h2><div class="gen">${Object.entries(res).map(([k,m])=>`<div class="g" style="--c:var(--${k})"><h3>${ORIG[k].nome} · ${m.q.length} perguntas</h3><small>Prova: ${esc(m.data)} · ${esc(m.desc)}</small>
  <ol>${m.q.slice(0,3).map(q=>`<li>${esc(q.t)} <b>Resposta: ${esc(q.o[q.c])}</b></li>`).join('')}</ol>${m.q.length>3?`<small>e mais ${m.q.length-3} perguntas</small>`:''}</div>`).join('')}</div>
  <p class="err" id="se" hidden></p>
  <div class="row"><button class="go ghost" id="dc">Descartar</button><button class="go" id="sv">Salvar no jogo</button></div></div>`;
 box.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
 document.getElementById('dc').onclick=()=>{box.innerHTML=''};
 document.getElementById('sv').onclick=async()=>{
  const sv=document.getElementById('sv');sv.disabled=true;
  const m={...localMap(),...res};
  try{localStorage.setItem(LKEY,JSON.stringify(m))}catch(e){}
  let shared=false;
  if(DBC){try{for(const [k,v] of Object.entries(res))await DBC.doc("conteudo/"+k).set({...v,updated:Date.now()});shared=true}catch(e){}}
  applyContent(m);
  box.innerHTML=`<p class="status">Pronto! ${Object.keys(res).map(k=>ORIG[k].nome).join(', ')} ${Object.keys(res).length>1?'foram atualizadas':'foi atualizada'}. ${shared?'As perguntas novas aparecem em todos os aparelhos que abrirem o jogo.':'As perguntas novas foram salvas neste aparelho.'}</p>`;
 };
}
function confirmRestore(){
 app.innerHTML=`<section class="card end pop"><h2>Voltar às perguntas originais?</h2><p>As perguntas criadas na Área dos pais serão apagadas. O monstrinho e os níveis da criança continuam.</p>
 <div class="row" style="justify-content:center"><button class="go ghost" id="no">Não, voltar</button><button class="go danger" id="yes">Sim, voltar às originais</button></div></section>`;
 document.getElementById('no').onclick=pais;
 document.getElementById('yes').onclick=async()=>{try{localStorage.removeItem(LKEY)}catch(e){}
  if(DBC){for(const k of MKEYS){try{await DBC.doc("conteudo/"+k).delete()}catch(e){}}}
  applyContent({});pais()};
}

home();
</script>
